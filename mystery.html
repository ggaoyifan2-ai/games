2:{t:'日记残页 · 其二',b:'（堡主闻川的日记）\n素娥病逝后的第七夜，我在地穴深处点燃了古书上记载的「雾心灯」。\n书上说：灯火不灭，逝者的魂魄便不会远去。\n雾果然升起来了。在雾里，我又听见了她的脚步声。'},
3:{t:'日记残页 · 其三',b:'（堡主闻川的日记）\n雾一年比一年重，开始吞没林中迷路的旅人。他们的影子被困在雾里，游荡不散。\n我终于明白：这盏灯留住的不是素娥，只是我不肯放手的执念。\n我把月、星、日三枚符文石藏在堡中。唯有让它们各归其位，地穴的封印才会打开，灯才能熄灭。\n可我……始终没有勇气。'},

function tileAt(a,x,y){if(x<0||y<0||x>=a.w||y>=a.h)return '#';return a.map[y][x];}
function blocked(a,x,y){const c=tileAt(a,x,y);
 if(c==='.'||c===','||c==='E')return false;
 if(c==='G')return !F.gateOpen; if(c==='D')return !F.doorOpen; if(c==='S')return !F.sealOpen; return true;}
function collides(a,x,y,h){const x0=Math.floor((x-h)/TS),x1=Math.floor((x+h-0.001)/TS),y0=Math.floor((y-h)/TS),y1=Math.floor((y+h-0.001)/TS);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(blocked(a,tx,ty))return true;return false;}
function moveEnt(e,dx,dy,h){const a=cur;let hit=false;
 if(dx){if(!collides(a,e.x+dx,e.y,h))e.x+=dx;else{hit=true;const ty=Math.floor(e.y/TS),off=e.y-(ty*TS+TS/2),ahead=Math.floor((e.x+Math.sign(dx)*(h+2))/TS);
  if(Math.abs(off)>0.5&&!blocked(a,ahead,ty)){const n=-Math.sign(off)*Math.min(Math.abs(off),Math.abs(dx));if(!collides(a,e.x,e.y+n,h))e.y+=n;}}}
 if(dy){if(!collides(a,e.x,e.y+dy,h))e.y+=dy;else{hit=true;const tx=Math.floor(e.x/TS),off=e.x-(tx*TS+TS/2),ahead=Math.floor((e.y+Math.sign(dy)*(h+2))/TS);
  if(Math.abs(off)>0.5&&!blocked(a,tx,ahead)){const n=-Math.sign(off)*Math.min(Math.abs(off),Math.abs(dy));if(!collides(a,e.x+n,e.y,h))e.x+=n;}}}
 return hit;}

/* ---------------- 音频 ---------------- */
const AU={c:null,m:null,on:true,nb:null,
 init(){if(this.c){if(this.c.state==='suspended'&&this.on){const p=this.c.resume();if(p&&p.catch)p.catch(()=>{});}return;}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();this.c=c;
   const m=c.createGain();m.gain.value=this.on?0.55:0;m.connect(c.destination);this.m=m;
   const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=3;const dg=c.createGain();dg.gain.value=0.06;lp.connect(dg);dg.connect(m);
   [[55,'sawtooth',0.5],[55.35,'sawtooth',0.5],[82.4,'triangle',0.6],[110.2,'sine',0.25]].forEach(v=>{const o=c.createOscillator();o.type=v[1];o.frequency.value=v[0];const g=c.createGain();g.gain.value=v[2];o.connect(g);g.connect(lp);o.start();});
   const lfo=c.createOscillator();lfo.frequency.value=0.07;const lg=c.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
   const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=buf;
   const n=c.createBufferSource();n.buffer=buf;n.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=0.6;
   const ng=c.createGain();ng.gain.value=0.022;n.connect(bp);bp.connect(ng);ng.connect(m);n.start();
   const l2=c.createOscillator();l2.frequency.value=0.11;const l2g=c.createGain();l2g.gain.value=0.016;l2.connect(l2g);l2g.connect(ng.gain);l2.start();
   if(c.state==='suspended'){const p=c.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){this.c=null;}},
 tone(f,dur,type,vol,delay){if(!this.c||!this.on)return;try{const c=this.c,t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+dur+0.05);}catch(e){}},
 noise(dur,freq,vol){if(!this.c||!this.on||!this.nb)return;try{const c=this.c,t=c.currentTime;const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=c.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+dur+0.05);}catch(e){}},
 chime(){const n=[523.25,587.33,659.25,783.99,880,1046.5];const f=n[Math.floor(Math.random()*n.length)];this.tone(f,3.2,'sine',0.03);this.tone(f*2.01,2,'sine',0.01);},
 sfx(k){switch(k){
  case'pick':this.tone(880,0.4,'triangle',0.07);this.tone(1320,0.7,'sine',0.05,0.08);break;
  case'page':this.noise(0.25,2500,0.05);this.tone(660,0.8,'sine',0.04,0.05);break;
  case'fire':this.noise(0.7,900,0.18);this.tone(196,0.6,'triangle',0.05);break;
  case'wrong':this.tone(110,0.7,'square',0.04);this.tone(104,0.8,'sawtooth',0.04);break;
  case'open':this.noise(1.4,300,0.25);[262,330,392,523].forEach((f,i)=>this.tone(f,1.6,'sine',0.05,i*0.12));break;
  case'rune':this.tone(740,0.9,'sine',0.06);this.tone(1110,1.2,'sine',0.03,0.1);break;
  case'hit':this.tone(70,1,'sawtooth',0.08);this.noise(0.8,600,0.15);break;
  case'end':[392,494,587,784,988,1175].forEach((f,i)=>this.tone(f,2.5,'sine',0.05,i*0.25));break;
  case'tap':this.tone(520,0.15,'sine',0.04);break;}},
 setOn(v){this.on=v;if(this.m)this.m.gain.value=v?0.55:0;}

function enterArea(id,sx,sy){cur=AREAS[id];areaId=id;P.x=sx*TS;P.y=sy*TS;cur.spawn={x:P.x,y:P.y};P.inv=Math.max(P.inv,0.8);

 FLY=[];PART=[];DUST=[];const R=rng(cur.seed*7+3);
 const walk=[];for(let y=0;y<cur.h;y++)for(let x=0;x<cur.w;x++){const c=cur.map[y][x];if(c==='.'||c===',')walk.push([x,y]);}
 for(let i=0;i<cur.flies;i++){let x,y;if(cur.flyHot&&i<cur.flies*0.55){const h=cur.flyHot;x=(h[0]+R()*(h[2]-h[0]+1))*TS;y=(h[1]+R()*(h[3]-h[1]+1))*TS;}
  else{const w=walk[Math.floor(R()*walk.length)];x=(w[0]+R())*TS;y=(w[1]+R())*TS;}FLY.push({hx:x,hy:y,ph:R()*6.28,sp:0.5+R()});}
 if(cur.theme!=='forest')for(let i=0;i<40;i++)DUST.push({x:R()*cur.w*TS,y:R()*cur.h*TS,vx:(R()-0.5)*6,vy:(R()-0.5)*4-2,ph:R()*6});
}

 }

function getMove(){
 if(HOOK)return {x:HOOK.x||0,y:HOOK.y||0};
 let x=0,y=0;if(K.ArrowLeft||K.KeyA)x-=1;if(K.ArrowRight||K.KeyD)x+=1;if(K.ArrowUp||K.KeyW)y-=1;if(K.ArrowDown||K.KeyS)y+=1;
 if(joy.id!==null){const R=50*UI;let dx=(joy.x-joy.bx)/R,dy=(joy.y-joy.by)/R;const l=Math.hypot(dx,dy);if(l>0.18){if(l>1){dx/=l;dy/=l;}x+=dx;y+=dy;}}

}
function update(dt){
 T+=dt;const act=actQueued;actQueued=false;
 if(msg){msg.age+=dt;msg.t-=dt;if(msg.t<=0)msg=null;}

 if(state==='ending'){endT+=dt;updateParticles(dt);if(act&&endT>ENDING.length*2.4+1.2){newGame();}return;}
 if(state==='pause')return;
 if(state==='modal'){modal.t+=dt;updateParticles(dt);if(act&&modal.t>0.15)closeModal();return;}
 // play
 F.time+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.5);banner=Math.max(0,banner-dt);P.inv=Math.max(0,P.inv-dt);
 const mv=getMove();const sp=112;
 if(Math.abs(mv.x)+Math.abs(mv.y)>0.01){P.moving=true;P.walk+=dt*Math.hypot(mv.x,mv.y);P.fx=mv.x;P.fy=mv.y;
  const st=sp*dt;const n=Math.ceil(st/6);for(let i=0;i<n;i++)moveEnt(P,mv.x*st/n,mv.y*st/n,9);}else P.moving=false;
 F.oil=Math.max(0,F.oil-dt*100/210);
 if(F.brReset>0){F.brReset-=dt;if(F.brReset<=0){F.brReset=0;F.lit=[];}}
 for(const it of cur.items){if(F.taken[it.id])continue;if(Math.hypot((it.x+0.5)*TS-P.x,(it.y+0.5)*TS-P.y)<20){pickup(it);if(state!=='play')return;}}

 if(tileAt(cur,tx,ty)==='E'){const e=cur.exits.find(e=>e.ty===ty);if(e){enterArea(e.to,e.sx,e.sy);return;}}
 P.target=findTarget();
 if(act&&P.target){interact(P.target);if(state!=='play')return;}
 else if(act&&msg)msg.t=Math.min(msg.t,0.3);
 for(const s of SH)updateShadow(s,dt);
 // embers
 for(const o of cur.objs){if(o.type==='brazier'&&F.lit.includes(o.bid)&&Math.random()<dt*14)PART.push({x:(o.x+0.5)*TS+(Math.random()-0.5)*10,y:(o.y+0.25)*TS,vx:(Math.random()-0.5)*14,vy:-25-Math.random()*30,life:0,max:1+Math.random(),col:[255,140+Math.random()*80|0,50],s:1+Math.random()*1.5});
  if(o.type==='lamp'&&Math.random()<dt*8)PART.push({x:(o.x+0.5)*TS+(Math.random()-0.5)*12,y:(o.y+0.2)*TS,vx:(Math.random()-0.5)*10,vy:-18-Math.random()*20,life:0,max:1.5,col:[110,170,255],s:1.5});
  if(o.type==='ped'&&F.ped[o.pid]&&Math.random()<dt*3)PART.push({x:(o.x+0.5)*TS+(Math.random()-0.5)*14,y:(o.y+0.3)*TS,vx:0,vy:-15,life:0,max:1.2,col:[120,230,255],s:1.2});}
 updateParticles(dt);
 for(const d of DUST){d.x+=d.vx*dt+Math.sin(T*0.5+d.ph)*dt*4;d.y+=d.vy*dt;if(d.y<0)d.y+=cur.h*TS;d.x=mod(d.x,cur.w*TS);}
 chimeT-=dt;if(chimeT<=0){AU.chime();chimeT=4+Math.random()*7;}
}

function updateShadow(s,dt){
 s.t+=dt;if(s.stun>0){s.stun-=dt;return;}
 const dx=P.x-s.x,dy=P.y-s.y,d=Math.hypot(dx,dy);let tx,ty,sp;
 if(SHADOWS_ON&&d<150&&P.inv<=0&&inZone(s.zone,P.x,P.y,1)){tx=P.x;ty=P.y;sp=60;s.chase=true;}
 else{s.chase=false;if(s.tx===null||Math.hypot(s.tx-s.x,s.ty-s.y)<6||s.stuck>1.5){const z=s.zone;for(let k=0;k<20;k++){const gx=z[0]+Math.floor(Math.random()*(z[2]-z[0]+1)),gy=z[1]+Math.floor(Math.random()*(z[3]-z[1]+1));if(!blocked(cur,gx,gy)){s.tx=(gx+0.5)*TS;s.ty=(gy+0.5)*TS;break;}}s.stuck=0;}

/* ---------------- 输入 ---------------- */
const K={};const joy={id:null,bx:0,by:0,x:0,y:0};let actTouch=null,lastTouch=0;
window.addEventListener('keydown',e=>{const c=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].indexOf(c)>=0)e.preventDefault();K[c]=true;
 if(!e.repeat){AU.init();if(c==='KeyE'||c==='Space'||c==='Enter'||c==='NumpadEnter'){if(state==='title')startGame(false);else actQueued=true;}
  if(c==='KeyP'||c==='Escape')togglePause();if(c==='KeyM')AU.setOn(!AU.on);}},{passive:false});
window.addEventListener('keyup',e=>{K[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in K)K[k]=false;joy.id=null;});
function handleTap(x,y,isT){
 if(state==='title'){startGame(isT);return;}
 if(state==='modal'||state==='ending'){actQueued=true;return;}
 if(state==='pause'){for(const b of BTN)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){AU.sfx('tap');pauseAction(b.id);return;}return;}
 if(state==='play'){const pb=pauseBtn();if(Math.hypot(x-pb.x,y-pb.y)<pb.r*1.5){togglePause();return;}if(msg)msg.t=Math.min(msg.t,0.3);}
}
cv.addEventListener('touchstart',e=>{e.preventDefault();lastTouch=Date.now();touchUI=true;AU.init();
 for(const t of e.changedTouches){const x=t.clientX,y=t.clientY;
  if(state==='play'){const pb=pauseBtn();if(Math.hypot(x-pb.x,y-pb.y)<pb.r*1.6){togglePause();continue;}
   const ab=actBtn();if(Math.hypot(x-ab.x,y-ab.y)<ab.r*1.45){actQueued=true;actTouch=t.identifier;continue;}
   if(joy.id===null&&x<W*0.55&&y>H*0.25){joy.id=t.identifier;joy.bx=x;joy.by=y;joy.x=x;joy.y=y;continue;}
   handleTap(x,y,true);}
  else handleTap(x,y,true);}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===joy.id){joy.x=t.clientX;joy.y=t.clientY;const dx=joy.x-joy.bx,dy=joy.y-joy.by,l=Math.hypot(dx,dy),m=60*UI;if(l>m){joy.bx=joy.x-dx/l*m;joy.by=joy.y-dy/l*m;}}}},{passive:false});
function tend(e){e.preventDefault();for(const t of e.changedTouches){if(t.identifier===joy.id)joy.id=null;if(t.identifier===actTouch)actTouch=null;}}
cv.addEventListener('touchend',tend,{passive:false});cv.addEventListener('touchcancel',tend,{passive:false});
cv.addEventListener('mousedown',e=>{if(Date.now()-lastTouch<800)return;AU.init();handleTap(e.clientX,e.clientY,false);});
['contextmenu','selectstart','dblclick','gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')state='pause';if(AU.c&&AU.c.suspend){const p=AU.c.suspend();if(p&&p.catch)p.catch(()=>{});}}else if(AU.c&&AU.on&&AU.c.resume){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}});
/* ---------------- 尺寸 ---------------- */
function resize(){const vv=window.visualViewport;W=Math.max(1,Math.round(window.innerWidth||(vv&&vv.width)||800));H=Math.max(1,Math.round(window.innerHeight||(vv&&vv.height)||600));
 DPR=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 ZOOM=clamp(Math.min(W,H)/(TS*11),1,3);UI=clamp(Math.min(W,H)/420,0.78,1.5);
 fx.width=Math.ceil(W/2);fx.height=Math.ceil(H/2);dk.width=Math.ceil(W/2);dk.height=Math.ceil(H/2);makeVignette();}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();F=newFlags();
/* ---------------- 主循环 ---------------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);render();}catch(err){console.error(err&&err.stack||err);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
/* ---------------- 测试钩子 ---------------- */
window.__game={
 start(){startGame(false);return this.info();},
 step(n,inp,noRender){inp=inp||{};for(let i=0;i<n;i++){HOOK=inp;if(i===0&&inp.act)actQueued=true;update(1/60);}HOOK=null;if(!noRender)render();return this.info();},
 info(){return {state,area:areaId,x:P.x,y:P.y,tx:Math.floor(P.x/TS),ty:Math.floor(P.y/TS),oil:F.oil,key:F.key,runes:F.runes.slice(),pages:F.pages.slice(),gateOpen:F.gateOpen,doorOpen:F.doorOpen,sealOpen:F.sealOpen,lit:F.lit.slice(),ped:Object.assign({},F.ped),objective:objective(),modal:modal?modal.title:null,msg:msg?msg.text:null,target:P.target?P.target.type:null,hits:F.hits,ended:F.ended,shadows:SH.map(s=>[s.x,s.y])};},
 findPath(gx,gy){const a=cur,sx=Math.floor(P.x/TS),sy=Math.floor(P.y/TS);const key=(x,y)=>y*a.w+x;const prev=new Map();prev.set(key(sx,sy),null);const q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();if(x===gx&&y===gy){const path=[];let k=key(x,y);while(k!==null){path.unshift([k%a.w,Math.floor(k/a.w)]);k=prev.get(k);}return path;}
   for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=a.w||ny>=a.h||blocked(a,nx,ny)||prev.has(key(nx,ny)))continue;prev.set(key(nx,ny),key(x,y));q.push([nx,ny]);}}
  return null;},
 setShadows(v){SHADOWS_ON=!!v;},
 shadowTouch(){if(!SH.length)return null;const s=SH[0];s.stun=0;P.inv=0;s.x=P.x+5;s.y=P.y;updateShadow(s,1/60);return this.info();},
 setOil(v){F.oil=v;},
 maps(){const o={};for(const id of AREA_ORDER)o[id]=AREAS[id].map;return o;},
 toEnding(t){endT=t;}
};
})();
</script>
